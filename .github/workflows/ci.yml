name: CI Pipeline - Lint, Test, Docker Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:

  lint:
    name: Code Quality (flake8)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install flake8

      - name: Run flake8 linter
        run: flake8 app.py --max-line-length=100 --ignore=E501

  test:
    name: Run pytest
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Run tests
        run: pytest test_app.py -v

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t github-actions-demo:${{ github.sha }} .

      - name: Verify image exists
        run: docker images | grep github-actions-demo